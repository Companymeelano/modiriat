name: Finance Android checks

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'MEELANO-Android/finance/**'
      - 'MEELANO-Android/build.gradle'
      - 'MEELANO-Android/settings.gradle'
      - 'MEELANO-Android/gradle.properties'
      - 'MEELANO-Android/gradlew'
      - '.github/workflows/finance-android.yml'
  pull_request:
    paths:
      - 'MEELANO-Android/finance/**'
      - 'MEELANO-Android/build.gradle'
      - 'MEELANO-Android/settings.gradle'
      - 'MEELANO-Android/gradle.properties'
      - 'MEELANO-Android/gradlew'
      - '.github/workflows/finance-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK not found at the runner SDK location." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > "$GITHUB_WORKSPACE/MEELANO-Android/local.properties"
          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "SDKMANAGER=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif command -v sdkmanager >/dev/null 2>&1; then
            echo "SDKMANAGER=$(command -v sdkmanager)" >> "$GITHUB_ENV"
          else
            echo "Android sdkmanager is not available on the runner." >&2
            exit 1
          fi

      - name: Install Android 36 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run Finance unit tests and assemble Debug APK
        working-directory: MEELANO-Android
        run: gradle --no-daemon --stacktrace :finance:testDebugUnitTest :finance:assembleDebug
