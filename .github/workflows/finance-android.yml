name: Finance Android checks

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'MEELANO-Android/finance/**'
      - 'MEELANO-Android/build.gradle'
      - 'MEELANO-Android/settings.gradle'
      - 'MEELANO-Android/gradle.properties'
      - 'MEELANO-Android/gradlew'
      - '.github/workflows/finance-android.yml'
  pull_request:
    paths:
      - 'MEELANO-Android/finance/**'
      - 'MEELANO-Android/build.gradle'
      - 'MEELANO-Android/settings.gradle'
      - 'MEELANO-Android/gradle.properties'
      - 'MEELANO-Android/gradlew'
      - '.github/workflows/finance-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run Finance unit tests and assemble Debug APK
        working-directory: MEELANO-Android
        run: gradle --no-daemon --stacktrace :finance:testDebugUnitTest :finance:assembleDebug
